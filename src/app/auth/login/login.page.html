<app-menu></app-menu>
<ion-content [fullscreen]="true" id="agecan-main-content">
  <div *ngIf="!isLoggedIn()">
    <ion-row>
      <ion-col size="2"></ion-col>
      <ion-col size="8">
        <h1 class="ion-text-center">Por favor ingresa tus credenciales</h1>
      </ion-col>
    </ion-row>
  
    <ion-row>
      <ion-col size="2"></ion-col>
      <ion-col size="8">
        <form>
          <ion-item>
            <ion-input label="Email" type="email" required></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="Contraseña" type="password" required></ion-input>
          </ion-item>
          <br/>
          <ion-button expand="full" type="submit">Ingresar</ion-button>
        </form>
          <div>
            <ion-button expand="full" (click)="signInWithGoogle()">
              <i class="fa-brands fa-google"></i>&nbsp;&nbsp;
              Ingresar con Google
            </ion-button>
            <ion-button expand="full" (click)="signInWithFacebook()">
              <i class="fa-brands fa-facebook"></i>&nbsp;&nbsp;
              Ingresar con Facebook
            </ion-button>
          </div>
        </ion-col>
    </ion-row>
  </div>
  <div *ngIf="isLoggedIn()">
    <ion-row>
      <ion-col size="2"></ion-col>
      <ion-col size="8">
        <h1 class="ion-text-center">Bienvenido {{user.name}}</h1>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="2"></ion-col>
      <ion-col size="8">
        <ion-button expand="full" (click)="signOut()">Cerrar sesión</ion-button>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
